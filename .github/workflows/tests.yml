name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  test:
    name: Run Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
    - name: Start Test Database
      run: docker compose --profile test up -d --wait db-test
    - name: Install X11 development dependencies
      run: sudo apt-get update && sudo apt-get install -y libx11-dev
    - name: Run Go Tests
      run: go test ./...
  docker-build:
    name: Verify Docker Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build .
