name: bassword-server

services:
  server:
    build: .
    image: bassword-server
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=userexample
      - DB_PASSWORD=passwordexample
      - DB_NAME=bassword-db
    depends_on:
    - db

  db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: userexample
      POSTGRES_PASSWORD: passwordexample
      POSTGRES_DB: bassword-db
    volumes:
    - db-data:/var/lib/postgresql
    attach: false

volumes:
  db-data:
